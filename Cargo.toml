[package]
name = "varanrs"
version = "0.2.0"
edition = "2024"

[lib]
name = "varanrs"
path = "src/lib.rs"

[[bin]]
name = "varanrs"
path = "src/main.rs"

[dependencies]
rust-htslib = { version = "1.0", default-features = false, features = ["static", "libdeflate"] }
# Direct dependency so build.rs receives DEP_HTS_INCLUDE (htslib headers) for
# compiling the vendored bcftools filter.c.
hts-sys = { version = "2.2", default-features = false, features = ["static", "libdeflate"] }
clap = { version = "4", features = ["derive"] }
rayon = "1"
crossbeam-channel = "0.5"
anyhow = "1"
thiserror = "1"
bitvec = "1"
csv = "1"
indexmap = "2"
histr = { git = "https://github.com/twolodzko/histr.git" }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
